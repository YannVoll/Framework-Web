<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Curso — Admin EduLab</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div th:insert="~{fragments/header :: header}"></div>
<div class="page-wrapper">
    <div class="section">
        <a href="/admin" style="color:var(--gray);font-size:0.9rem">← Voltar ao painel</a>
        <div class="form-card" style="max-width:640px;margin-top:24px">
            <div class="form-title" th:text="${courseId != null} ? 'Editar Curso' : 'Novo Curso'">Curso</div>
            <p class="form-subtitle">Preencha as informações do curso</p>
            <form th:action="${courseId != null} ? @{'/admin/courses/' + ${courseId} + '/edit'} : @{/admin/courses/new}"
                  th:object="${courseRequest}" method="post">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" th:field="*{title}" placeholder="Ex: Java para Iniciantes"/>
                    <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <textarea th:field="*{description}" rows="3" placeholder="Descreva o conteúdo do curso"></textarea>
                    <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>
                <div class="form-group">
                    <label>Instrutor</label>
                    <input type="text" th:field="*{instructor}" placeholder="Nome do instrutor"/>
                    <div class="field-error" th:if="${#fields.hasErrors('instructor')}" th:errors="*{instructor}"></div>
                </div>
                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" th:field="*{price}" step="0.01" min="0" placeholder="199.90"/>
                    <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="form-group">
                    <label>URL da imagem (opcional)</label>
                    <input type="text" th:field="*{imageUrl}" placeholder="/images/java-course.svg"/>
                </div>
                <div style="display:flex;gap:12px;margin-top:8px">
                    <button type="submit" class="btn btn-primary" th:text="${courseId != null} ? 'Salvar alterações' : 'Criar curso'">Salvar</button>
                    <a href="/admin" class="btn btn-outline">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
